<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        ul { list-style-type: none; padding: 0; }
        li { background: #eee; margin: 5px 0; padding: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background-color: #dc3545; width: auto; padding: 5px 10px; margin: 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>📚 My Library App</h2>

    <h3>Add a New Book</h3>
    <input type="text" id="titleInput" placeholder="Book Title (e.g., The Hobbit)">
    <input type="text" id="authorInput" placeholder="Author (e.g., J.R.R. Tolkien)">
    <button onclick="addBook()">Add Book to Library</button>

    <h3>Library Catalogue</h3>
    <ul id="bookList">
        <!-- Books will appear here -->
    </ul>
</div>

<script>
    // 1. Fetch books when the page loads
    window.onload = function() {
        loadBooks();
    };

    // 2. Function to GET all books from your Java API
    function loadBooks() {
        fetch('/books')
            .then(response => response.json())
            .then(books => {
                const list = document.getElementById('bookList');
                list.innerHTML = ''; // Clear current list

                books.forEach(book => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span><strong>${book.title}</strong> by ${book.author}</span>
                        <button class="delete-btn" onclick="deleteBook(${book.id})">Delete</button>
                    `;
                    list.appendChild(li);
                });
            });
    }

    // 3. Function to POST a new book to your Java API
    function addBook() {
        const title = document.getElementById('titleInput').value;
        const author = document.getElementById('authorInput').value;

        if (!title || !author) {
            alert("Please enter both a title and an author.");
            return;
        }

        const newBook = {
            title: title,
            author: author,
            available: true
        };

        fetch('/books', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newBook)
        })
            .then(response => {
                if (response.ok) {
                    document.getElementById('titleInput').value = '';
                    document.getElementById('authorInput').value = '';
                    loadBooks(); // Refresh the list
                }
            });
    }

    // 4. Function to DELETE a book by ID
    function deleteBook(id) {
        if (confirm("Are you sure you want to delete this book?")) {
            fetch(`/books/${id}`, { method: 'DELETE' })
                .then(response => {
                    if (response.ok) {
                        loadBooks(); // Refresh the list
                    }
                });
        }
    }
</script>

</body>
</html>
